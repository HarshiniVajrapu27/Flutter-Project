<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Flutter Web entry point for SkillApply — Job Application Form.
    The $FLUTTER_BASE_HREF placeholder is replaced at build time.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="SkillApply — A smart, responsive job application form built with Flutter Web. Submit your skills, experience, and resume details online.">
  <meta name="keywords"
        content="job application, flutter web, skills form, career, resume, SDG 8">
  <meta name="author" content="SkillApply">

  <!-- Open Graph / Social preview -->
  <meta property="og:title"       content="SkillApply — Smart Job Application Form">
  <meta property="og:description" content="Take the next step in your career. Fill out our structured job application form.">
  <meta property="og:type"        content="website">

  <!-- iOS / PWA meta tags -->
  <meta name="mobile-web-app-capable"          content="yes">
  <meta name="apple-mobile-web-app-capable"    content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title"      content="SkillApply">
  <meta name="theme-color"                     content="#1565C0">

  <!-- Favicon -->
  <link rel="icon"             type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" type="image/png" href="icons/Icon-192.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>SkillApply — Job Application Form</title>

  <style>
    /* Loading spinner shown before Flutter initialises */
    body {
      margin: 0;
      background-color: #F5F7FA;
      font-family: Roboto, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #E3EAF5;
      border-top-color: #1565C0;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #1565C0;
      font-size: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Pre-Flutter loading indicator -->
  <div id="loading">
    <div class="spinner"></div>
    <p class="loading-text">Loading SkillApply…</p>
  </div>

  <script>
    // Hide the loading indicator once Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });

    var serviceWorkerVersion = null;
    var scriptLoaded = false;

    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src  = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var serviceWorkerUrl =
          'flutter_service_worker.js?v=' + serviceWorkerVersion;

        navigator.serviceWorker.register(serviceWorkerUrl).then(function (reg) {
          function waitForActivation(serviceWorker) {
            serviceWorker.addEventListener('statechange', function () {
              if (serviceWorker.state === 'activated') {
                console.log('Installed new service worker.');
                loadMainDartJs();
              }
            });
          }

          if (!reg.active && (reg.installing || reg.waiting)) {
            waitForActivation(reg.installing || reg.waiting);
          } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
            console.log('New service worker available.');
            reg.update();
            waitForActivation(reg.installing);
          } else {
            console.log('Loading app from service worker.');
            loadMainDartJs();
          }
        });

        setTimeout(function () {
          if (!scriptLoaded) {
            console.warn('Service worker fallback: loading script directly.');
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>
</html>
